name: MultiverseCreatures
version: '${project.version}'
main: com.Chagui68.MultiverseCreatures
api-version: '1.21'
load: STARTUP
author: Chagui68
description: A themed creatures and items plugin
website: https://github.com/SlimefunNewHorizons/MultiverseCreatures
softdepend: [Slimefun, InfinityExpansion, SlimeTinker, DrakesBosses]

commands:
  msc:
    description: Main command for MultiverseCreatures
    usage: /msc <spawn|give|attack|music|dimtp|kill|debug|reload|troll> - run /msc for help
    permission: msc.admin
  stand:
    description: Your Stand, its abilities and Killer Queen's Sheer Heart Attack
    usage: /stand [summon|ability|sha|give|remove|vampire|arrow]
    permission: msc.stand
  mscwiki:
    description: Opens the in-game wiki (English and Spanish) with every item, recipe and drop
    usage: /mscwiki [portal|sentinel|nix|dio|jack|olympus|asgard|duat|void|witherstorm]
    permission: msc.wiki
  mscevent:
    description: Event teams - create one, invite players, leave, and more; ranked when an event boss falls
    usage: /mscevent team <create|join|add|remove|leader|disband|leave|list|info>
    permission: msc.event

permissions:
  msc.admin:
    description: Allows all /msc commands
    default: op
  msc.stand:
    description: Allows using /stand (your own Stand); the admin subcommands need msc.admin
    default: true
  msc.wiki:
    description: Allows opening the in-game wiki with /mscwiki
    default: true
  msc.event:
    description: Allows using /mscevent to join and run event teams
    default: true
  msc.admin.bypass:
    description: Bypasses the protected boss-dimension build and teleport rules
    default: op
