# =============================================================================
# MultiverseCreatures — Main Configuration
# =============================================================================
# Version of this file. A server that updates the plugin keeps its own config.yml and the plugin
# adds whatever keys are missing on start (values you edited are never touched), stamping the new
# version here. See MscConfigMigration.CONFIG_VERSION — keep the two in step.
config-version: 7
#
# SlimeTinker Infinity against every boss except Mahoraga (which adapts on its own):
#   pierce-infinity-armor: boss hits pierce the full Infinity set (absorption is cleared first)
#   infinity-weapon-damage-multiplier: share of an Infinity Singularity weapon's damage a boss takes
# Network load of the boss effects. Every particle is one packet per player who sees it, so these
# two keep a fight with many players from flooding their connections:
#   particle-budget-per-tick: most particle calls sent per tick; above it every effect thins evenly
#   particle-view-distance: blocks around a particle within which players receive it
performance:
  particle-budget-per-tick: 150
  particle-view-distance: 48
boss-balance:
  pierce-infinity-armor: true
  infinity-weapon-damage-multiplier: 0.5
  # Boss damage adapts to what each player has invested, so endgame players are hit as hard, relative
  # to their health, as fresh ones. Applies to every boss but Mahoraga (which adapts on its own).
  # factor = health x rank x effects (x gear for Garou and Kinger, whose hits armour still reduces),
  # clamped to [1, max-factor]; it multiplies both the hit and its max-damage-dealt cap.
  adaptive-damage:
    enabled: true
    health-weight: 1.0            # (max health / 20) ^ weight: 40 HP -> x2
    per-rank-tier: 0.003          # DrakesRankup tier 100 -> +30%
    per-rebirth: 0.03             # DrakesRankup rebirths, +3% each
    per-resistance-level: 0.15    # Resistance I -> +15%, II -> +30%
    absorption-weight: 1.0        # absorption hearts count as extra health
    per-armor-point: 0.01         # gear terms only for hits armour reduces
    per-toughness-point: 0.015
    per-protection-level: 0.01    # summed over the four armour pieces
    max-factor: 5.0
  # A boss with no player (spectators do not count) within radius blocks for delay-ticks is removed,
  # so an abandoned fight stops costing the server. large-radius is for colossal bosses (the Wither
  # Storm's Destroyer and Devourer). Applies to every MultiverseCreatures boss.
  despawn:
    enabled: true
    radius: 50.0
    large-radius: 100.0
    delay-ticks: 100              # 5 seconds
#
# All paths match the code:
#   general.*                          -> MultiverseCreatures, MobHandler, MscWorldPolicy
#   recipes.*                          -> MultiverseCreatures#onEnable
#   boss-arena.*                       -> BossArena / BossDimensionManager
#   entities.<mob>.*                   -> each entity class + MobHandler
#   items.<item>.*                     -> item handlers / GrimoireHandler
#   commands.*                         -> MSCCommand
#   stands.*                           -> StandManager (Stands awakened by the Arrow)
#   vampire.*                          -> VampireManager (DIO's blood)
# =============================================================================


# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
general:
  debug: false
  # Global multiplier applied to every entity spawn chance (0.5 = half spawns)
  spawn-rate-multiplier: 0.5
  # Cap of live MSC creatures per world. 0 disables the limit.
  max-alive-per-world: 500
  # If true, natural-spawn mobs stay persistent when players move away
  natural-spawn-persistent: false
  # Worlds where the plugin is allowed to operate. Empty list = every world.
  # The plugin's own worlds (boss_dimension, drakes_bosses) are always allowed.
  allowed-creature-worlds: []
  # If true, MSC creatures found in a world outside the allowlist are deleted. Off by default:
  # this removes live entities, so it only runs when an operator asks for it.
  purge-disallowed-creatures: false


# ---------------------------------------------------------------------------
# Custom recipes
# ---------------------------------------------------------------------------
recipes:
  enabled: true
  # Register recipes a few ticks after startup (avoids EquivalencyTech EMC bug)
  deferred-registration: true


# ---------------------------------------------------------------------------
# Final boss arena / dimension
# ---------------------------------------------------------------------------
boss-arena:
  world-name: "drakes_bosses"


# ---------------------------------------------------------------------------
# Ritual dimension (boss_dimension)
# ---------------------------------------------------------------------------
# The world the ritual teleports players to: a scorched battlefield around a paved arena, with lava
# rivers and lakes, craters, obsidian spikes, ruins and bones, closed in by a jagged obsidian range
# and a world border. Settings here only affect how that world is created, never the fight itself.
boss-dimension:
  # Recolour the plains sky and fog red for the ritual's look (the dimension's biome).
  # The biome is a vanilla one, so the tint is global: turn this off to leave the overworld alone.
  red-sky: true
  # Side of the square world border around the spawn, in blocks (100 - 1500). The terrain is
  # designed for 1500: a smaller border cuts the battlefield before its boundary mountains.
  size: 1500
  # Delete the dimension folder on the next start and generate it again from scratch.
  # A world built by an older generator is rebuilt once on its own; this switch forces it.
  # One-shot switch: it destroys everything built in that world. Set it back to false after.
  reset-on-load: false


# ---------------------------------------------------------------------------
# DrakesBosses gods in the ritual dimension (soft dependency)
# ---------------------------------------------------------------------------
# With DrakesBosses installed, its gods can be summoned inside boss_dimension at a Pantheon Altar:
#
#   P . . . P     P = pillar, 2 blocks tall
#   . . c . .     c = candle (4 of them, lit)
#   . c A c .     A = altar core
#   . . c . .
#   P . . . P
#
#   Olympus  : white candles,  chiseled quartz core,   quartz pillars
#   Asgard   : green candles,  chiseled deepslate core, spruce log pillars
#   Duat     : orange candles, chiseled sandstone core, smooth sandstone pillars
#   the Void : purple candles, end stone bricks core,  purpur pillars
#
# Light the four candles, then drop (Q) one god's offering on the core. DrakesBosses spawns the god,
# with its own stats, skills, loot and rewards. Without DrakesBosses the altar does nothing.
drakes-bosses:
  enabled: true
  # Ticks between the offering and the god's arrival (1 - 200).
  arrival-delay-ticks: 40
  # A living god counts as a boss fight, which locks building and commands in the dimension. A god
  # left alone is sent away like every other boss (boss-balance.despawn).
  # Item each god takes, by DrakesBosses id. Keep them unique: an item calls the first god listing it.
  offerings:
    # Olympus
    zeus: LIGHTNING_ROD
    poseidon: HEART_OF_THE_SEA
    hades: WITHER_SKELETON_SKULL
    ares: NETHERITE_SWORD
    artemisa: SPECTRAL_ARROW
    prometeo: FIRE_CHARGE
    circe: AMETHYST_SHARD
    polifemo: FERMENTED_SPIDER_EYE
    kratos: NETHERITE_AXE
    tifon: MAGMA_BLOCK
    hidra: PRISMARINE_SHARD
    cerbero: BONE_BLOCK
    # Asgard
    thor: IRON_BLOCK
    odin: GOLD_BLOCK
    loki: ENDER_PEARL
    heimdall: BLAZE_ROD
    # Duat
    ra: GOLDEN_CARROT
    isis: FEATHER
    anubis: ROTTEN_FLESH
    set: REDSTONE_BLOCK
    # the Void
    coloso_end: ECHO_SHARD
    garou_cosmico: NETHER_STAR
    dios_corrupto: TOTEM_OF_UNDYING
    wither_storm: WITHER_ROSE
    dragon_ancestral: DRAGON_BREATH
    jax: LANTERN


# ---------------------------------------------------------------------------
# Commands
# ---------------------------------------------------------------------------
# Commands
commands:
  # Permission node required to run /msc.
  permission: "msc.admin"
  # If true, server operators can run /msc even when they lack the node above.
  op-only: true
  # Optional per-subcommand nodes, e.g. `debug: msc.debug`. A subcommand listed here needs its node
  # on top of the main one; anything absent or blank stays open to whoever passed the gate above.
  subcommand-permissions: {}


# =============================================================================
# ENTITIES — each sub-section toggled via `entities.<id>.enabled`
# =============================================================================
entities:

  # -------------------------------------------------------------------------
  # Final Boss — Obsidian Sentinel (Armor Stand Boss)
  # -------------------------------------------------------------------------
  armor-stand-boss:
    enabled: true
    health: 3200.0
    # Scale of the boss's own stand. Unlike the dressed bosses below, the Sentinel *is* the stand:
    # its scale is both the size of the model and the box players hit. 7.5 is what the fight was
    # tuned for; the value is clamped to 0.25-8.0 so a typo cannot make it unhittable or oversized.
    hitbox-scale: 7.5
    aggro-range: 50.0
    seal-damage: 15.0
    hover-barrage-damage: 12.0
    sentinel-core-drop-chance: 100.0

    # Penetrating damage: ignores armor / protection. If false, uses normal damage.
    penetrating-damage: true
    # Share of the Resistance potion's damage reduction that penetrating hits ignore (0.2 = 20%).
    # 0.0 leaves Resistance fully effective, 1.0 ignores it completely.
    penetrating-resistance-pierce: 0.2
    max-damage-dealt: 15.0        # cap for penetrating damage dealt per hit
    max-damage-per-hit: 50.0      # cap for damage the boss can receive per hit
    phase-transition-slam-damage: 10.0

    # Phase thresholds: the fraction of max health at which each next phase begins, highest first.
    # The number of phases is one more than the entries here, and it is also how many squares the
    # boss bar title shows (one per phase, red for the phases left, grey for the ones spent).
    phase-thresholds: [0.8, 0.6, 0.4, 0.2]

    # How long each defensive state lasts, in ticks (20 ticks = 1 s).
    defense-duration-stone-skin-ticks: 200       # ~10 s
    defense-duration-reflect-barrier-ticks: 160  # ~8 s
    defense-duration-absorb-shield-ticks: 300    # ~15 s, or until the shield is broken
    defense-duration-bulwark-ticks: 120          # ~6 s braced (x0.35 damage), rooted in place
    defense-duration-thorn-aura-ticks: 200       # ~10 s (x0.8 damage, every hit stings back)
    defense-duration-afterimage-ticks: 160       # ~8 s (35% of hits miss)

    # Healing defences, as a share of max health restored over the whole defence.
    healing-circle-heal-percent: 0.05            # over its 10 s kneel
    regeneration-heal-percent: 0.05              # over 8 s, while it keeps fighting
    obsidian-cocoon-heal-percent: 0.04           # over 3 s sealed (and invulnerable) in obsidian

    # Attacks. Every attack shares one clock: attack-interval-ticks after the last one ends, the
    # attack tick rolls the KIND of attack with these weights, then an attack of that kind. An
    # attack cannot come back until three others have been thrown.
    attack-interval-ticks: 50                    # 2.5 s between attacks
    attack-type-weights:
      melee: 30            # ground attacks, picked by distance
      ranged: 20           # projectiles and beams
      flight: 10           # takes off for a flight of aerial attacks
      hover-barrage: 8
      shield-seal: 8
      aegis-judgment: 8    # the shield thrown into the sky
      defense: 12          # below 90% health; the healing ones below 70%
      summon: 25           # the call for help, only from behind the shield seal
      aerial: 80           # in the air, against ranged
      summoning: 10        # summoning rites (minions, and once per phase a champion boss)
      destructive: 6       # long-charged cataclysms; doubled in the last phase
    max-summons: 8                   # no rite is cast while this many minions are alive
    destructive-gap-ticks: 400       # at least 20 s between two destructive attacks
    shield-retrieve-delays: [80, 90, 100, 110, 120]

    # Ground recovery. A grounded boss only attacks while it has solid ground under it, so if it
    # ends up over a void, water or a hole it teleports to the nearest column with ground.
    ground-recovery-grace-ticks: 40      # ticks without a floor before relocating (~2 s)
    ground-recovery-search-radius: 12    # rings of blocks probed around the boss
    ground-recovery-cooldown-ticks: 100  # minimum ticks between attempts (5 s)

    # Per-attack damage overrides (override code defaults)
    blade-ring-damage: 7.0
    cataclysm-damage: 20.0
    chain-grapple-damage: 2.0
    earth-maw-damage: 9.0
    eclipse-fall-damage: 16.0
    executioner-sweep-damage: 16.0
    gravity-well-min-damage: 3.0
    gravity-well-max-damage: 8.0
    lance-flurry-damage: 7.0
    mirror-image-damage: 6.0
    obsidian-spire-damage: 11.0
    obsidian-wings-damage: 8.0
    obsidian-wings-slam-damage: 15.0
    obsidian-prison-damage: 16.0
    phantom-legion-damage: 11.0
    plague-brand-damage: 4.0
    plague-brand-hit-damage: 9.0
    rune-mine-damage: 8.0
    rune-ward-damage: 4.0
    shadow-step-damage: 15.0
    shield-bash-damage: 12.0
    spear-cyclone-damage: 4.0
    sundering-charge-damage: 14.0
    void-meteor-damage: 18.0
    soul-tether-damage: 3.0
    soul-tether-snap-damage: 13.0
    vortex-pull-tick-damage: 2.0
    vortex-pull-final-damage: 6.0
    war-stomp-damage: 8.0
    whirlwind-slash-damage: 9.0
    whirlwind-slash-secondary-damage: 6.0

    death-messages:
      - "&c%player% was sealed by the Obsidian Sentinel"
      - "&c%player% was judged by the Obsidian Sentinel"
      - "&c%player% could not withstand the Sentinel's power"
      - "&c%player% was erased by the Sentinel's magic"

  # -------------------------------------------------------------------------
  # Mini-Boss — Mahoraga
  # -------------------------------------------------------------------------
  mahoraga:
    enabled: true
    spawn-chance: 0.002
    health: 350.0
    drop-chance: 0.75
    max-damage-per-hit: 100.0
    speed-effect-level: 3
    true-damage-base: 4.0
    true-damage-per-stage: 2.0
    adaptation-base-damage: 4.0
    adaptation-cooldown-seconds: 6
    arrow-reduction-per-step: 0.2
    arrow-max-reduction: 0.8
    infinity-weapon-damage: 1.0
    slimefun-adaptation: true
    ignore-diamond-mod: true
    infinity-weapon-adaptation: true
    death-messages:
      - "&f%player% was crushed by Mahoraga"
      - "&f%player% could not adapt to Mahoraga"
      - "&f%player% was obliterated by Mahoraga"
      - "&f%player% stood no chance against Mahoraga"

  # -------------------------------------------------------------------------
  # Mini-Boss — Garou (Hero Hunter)
  # -------------------------------------------------------------------------
  garou:
    enabled: true
    spawn-chance: 0.0015
    health: 1800.0
    speed: 0.38
    attack-damage: 28.0
    skill-damage: 16.0
    counter-damage: 14.0
    counter-chance: 0.25
    counter-cooldown-ms: 3000
    death-messages:
      - "&5%player% was humiliated by Garou's martial arts"
      - "&5%player% fell to Garou's Water Stream Fist"
      - "&5%player% was countered by Garou"
      - "&5%player% could not keep up with Garou"

  # -------------------------------------------------------------------------
  # Kinger (chess piece)
  # -------------------------------------------------------------------------
  kinger:
    enabled: true
    spawn-on-armorstand-chance: 0.01
    health: 120.0
    # Size of the invisible stand the suit is hit through. 1.0 is a plain stand, which already
    # covers the whole model; raise it to make the chess piece easier to hit.
    hitbox-scale: 1.0
    aggro-range: 25.0
    move-speed: 0.32
    melee-range: 3.0
    melee-damage: 8.0
    melee-radius: 3.5
    melee-cooldown-ticks: 25
    melee-anim-ticks: 12
    ranged-range: 30.0
    ranged-damage: 6.0
    ranged-cooldown-ticks: 45
    ranged-anim-ticks: 20
    death-messages:
      - "&d%player% was checkmated by Kinger"
      - "&d%player% was knocked off the board by Kinger"
      - "&d%player% lost the game to Kinger"
      - "&d%player% was outplayed by the chess piece"

  # -------------------------------------------------------------------------
  # DIO - JoJo's Bizarre Adventure, with his Stand The World (/msc spawn dio)
  # -------------------------------------------------------------------------
  dio-brando:
    enabled: true
    health: 1500.0
    aggro-range: 32.0
    move-speed: 0.26
    max-damage-per-hit: 75.0      # cap on the damage DIO can receive from a single hit
    attack-cooldown-ticks: 45     # pause between attacks (halved below 50% health)
    punch-damage: 12.0            # The World's single punch, his basic attack
    barrage-damage: 2.5           # each hit of the MUDA MUDA barrage (every 3 ticks)
    barrage-finisher-damage: 14.0 # the last "MUDA!"
    knife-damage: 5.0             # each knife, thrown or waiting in stopped time
    road-roller-damage: 26.0      # the road roller landing (half again when it explodes)
    eye-beam-damage: 5.0          # Space Ripper Stingy Eyes, every 3 ticks in the jet
    # ZA WARUDO: players inside the radius cannot move, attack, use items or shoot;
    # mobs and projectiles stop too. 40 ticks longer below 50% health.
    time-stop-ticks: 100
    time-stop-radius: 40.0
    time-stop-cooldown-ticks: 700
    # The Final Hour (destructive): a clock face under the arena, one safe hour, The World
    # pummels every other one. At most once per final-hour-cooldown-ticks.
    final-hour-cooldown-ticks: 900
    # True damage, the same kind the Obsidian Sentinel deals: armour and Protection are ignored,
    # each hit is capped at max-damage-dealt, and Resistance keeps only part of its effect
    # (true-damage-pierce is the share of it that is ignored).
    max-damage-dealt: 15.0
    true-damage-pierce: 0.2
    death-messages:
      - "&6%player% &ewas flattened by DIO's Road Roller"
      - "&6%player% &ecould not move in DIO's stopped time"
      - "&6%player% &etook a MUDA MUDA MUDA from The World"
    # Vampire Blood dropped when DIO falls: the ingredient of the Bearer's Elixir.
    vampire-blood-min: 1
    vampire-blood-max: 2

  # -------------------------------------------------------------------------
  # NIX - The Executioner
  # -------------------------------------------------------------------------
  nix-executioner:
    enabled: true
    health: 2000.0
    # Size of the invisible stand the suit is hit through (1.9 covers the whole model).
    hitbox-scale: 1.9
    aggro-range: 28.0
    move-speed: 0.30
    melee-range: 3.5
    melee-damage: 14.0
    cleave-damage: 22.0
    chain-range: 24.0
    max-damage-per-hit: 100.0      # cap on the damage Nix can receive from a single hit
    melee-cooldown-ticks: 20
    chain-cooldown-ticks: 80
    cleave-anim-ticks: 14
    # Specials, one every special-cooldown-ticks (+0-2 s), never one of the last three again.
    # Signature moves: Blood Harvest (a whirl of blood blades, hits once per revolution), Gallows
    # Leap (a leap and two-handed slam, half damage on the shockwave) and Condemnation (a guillotine
    # over each player that falls 1.5 s later). Arsenal: Headsman's Toss, Blood Pool (heals him),
    # Iron Maiden, Gallows Noose, Executioner's March, Pillory, Crimson Rain, Severing Cross,
    # Last Rites (hits harder below half health) and Chain Whirl.
    special-cooldown-ticks: 160
    harvest-damage: 9.0
    gallows-damage: 18.0
    condemn-damage: 20.0
    arsenal-damage-multiplier: 1.0  # scales the damage of the ten arsenal attacks
    # Destructive attacks (Grand Guillotine, Blood Moon, Execution Day), at most one per
    # destructive-cooldown-ticks.
    destructive-cooldown-ticks: 600
    # True damage, the same kind the Obsidian Sentinel deals: armour and Protection are ignored,
    # each hit is capped at max-damage-dealt, and Resistance keeps only part of its effect
    # (true-damage-pierce is the share of it that is ignored).
    max-damage-dealt: 15.0
    true-damage-pierce: 0.2
    death-messages:
      - "&4%player% was executed by NIX - The Executioner"
      - "&4%player%'s sentence was carried out by NIX - The Executioner"
      - "&4%player% fell under the guillotine of NIX"
      - "&4%player% could not escape the executioner's judgment"
    # Executioner's Edge dropped when NIX falls (two forge the Executioner's Guillotine):
    # one with edge-drop-chance, plus a second one with edge-bonus-chance.
    edge-drop-chance: 1.0
    edge-bonus-chance: 0.35

  # -------------------------------------------------------------------------
  # JACKSTAR - The System Architect
  # -------------------------------------------------------------------------
  jackstar-architect:
    enabled: true
    health: 1000.0
    # Size of the invisible stand the suit is hit through (1.2 covers the whole model).
    hitbox-scale: 1.2
    aggro-range: 30.0
    move-speed: 0.32
    melee-range: 3.8
    melee-damage: 16.0
    slam-damage: 20.0
    sigkill-damage: 35.0
    dodge-chance: 0.22
    packet-loss-chance: 0.25
    max-damage-per-hit: 60.0      # cap on the damage JackStar can receive from a single hit
    # Every attack but the three-slash is a special, and only one special starts per
    # special-attack-gap-ticks (112 = 5.6 s), never the same kind twice in a row.
    special-attack-gap-ticks: 112
    # Phase 5 (kernel panic) runs every attack cooldown at this share: 0.9 = 10% shorter.
    final-phase-cooldown-multiplier: 0.9
    # At most one chat line per message-cooldown-ticks (600 = 30 s); phase changes always show.
    message-cooldown-ticks: 600
    # Signature moves, one every special-cooldown-ticks (+0-2 s): fork() (a cube that splits on
    # every landing, three generations), Binary Rain (bits falling in telegraphed cells) and Stack
    # Overflow (four dashing cuts, then every cut detonates in reverse).
    special-cooldown-ticks: 200
    fork-bomb-damage: 10.0
    binary-rain-damage: 8.0
    stack-overflow-damage: 14.0
    # Twenty arsenal attacks, four per phase; each phase also keeps its predecessor's at a lower
    # chance. 1: Ping Flood, Null Pointer, Syntax Error, Packet Sniffer. 2: Memory Leak, Infinite
    # Loop, Ctrl+Z, Firewall Ring. 3: Thread Spikes, DDoS, Encryption Lock, Port Scan.
    # 4: Segmentation Fault, Overclock, Recursive Clone, Blue Screen. 5: rm -rf /, Root Access,
    # Zero Day, System Crash.
    arsenal-damage-multiplier: 1.0  # scales the damage of the twenty arsenal attacks
    # Destructive attacks from phase 2 (Kernel Nuke, Disk Format, sudo laser), at most one per
    # destructive-cooldown-ticks.
    destructive-cooldown-ticks: 500
    # True damage, the same kind the Obsidian Sentinel deals: armour and Protection are ignored,
    # each hit is capped at max-damage-dealt, and Resistance keeps only part of its effect
    # (true-damage-pierce is the share of it that is ignored).
    max-damage-dealt: 15.0
    true-damage-pierce: 0.2
    death-messages:
      - "&b%player% &7was dismantled by &3JackStar — The System Architect"
      - "&b%player% &7received a &cSIGKILL (kill -9) &7from &3JackStar"
      - "&b%player% &7could not escape the &5Vector Override &7of &3JackStar"
      - "&b%player% &7was reaped as an orphan process by the &eGarbage Collector"

  # -------------------------------------------------------------------------
  # Wither Storm (Cracker's Wither Storm Mod, drawn with block displays)
  # -------------------------------------------------------------------------
  # Summoned by building the Wither's own structure (4 soul sand or soul soil, 3 wither skeleton
  # skulls) with the bottom of its stem resting on summon.core-block. The Wither is swallowed with
  # the core block and the storm forms in its place; built anywhere else it is a plain Wither.
  # /msc spawn witherstorm summons it too (witherstorm2..witherstorm5 start in a later form).
  wither-storm:
    enabled: true
    health: 800.0                 # max health of the first form; each form multiplies it
    max-damage-per-hit: 150.0     # cap on what a single hit takes from it
    # Its hits are true damage: armour and Protection are ignored, each hit is capped at
    # max-damage-dealt and Resistance keeps only part of its effect.
    max-damage-dealt: 20.0
    true-damage-pierce: 0.2
    bite-damage: 14.0             # a player dragged into a mouth is bitten and spat out
    tentacle-damage: 10.0         # a tentacle tip sweeping through a player
    revive-damage: 12.0           # the blast when it rises after playing dead
    # Whether the tractor beams tear blocks out of the ground and the flaming skulls break and burn
    # them. Also needs the mobGriefing game rule, and protection plugins can cancel each block.
    # Without it the storm still swallows (and grows from) what its beams tear up, but the ground
    # stays where it is.
    grief-blocks: true
    aggro-range: 64.0             # grows with the size of the form
    attack-mobs: true             # hunts every living thing round it, players first, like the mod
    max-per-world: 1
    # Draw the Destroyer with the mod's full 401-voxel mass (548 displays) instead of its low-detail
    # one (180 displays). Heavier on the network and on clients.
    high-detail: false
    # A head roars (and spits a flaming skull) every roar-interval-min..max ticks (the mod: 20-50 s).
    roar-interval-min-ticks: 400
    roar-interval-max-ticks: 1000
    # The tractor beam, from the second form on (only the middle head until the Destroyer). It only
    # locks on once its head points at a victim it can see, lights up thin for charge-ticks, pulls for
    # at most hold-ticks at pull-speed blocks per tick (the mod's 0.2) and rests for rest-ticks. While
    # it is on, the head turns slower than a sprint: run across the beam to break free.
    beam:
      pull-speed: 0.2
      charge-ticks: 30
      hold-ticks: 120
      rest-ticks: 100
    # Projectiles injure a head: its beam goes dark for injury-ticks and it takes 1.5x damage, and the
    # player who injured it is left alone for escape-ticks (the mod's 40 s). With every head injured
    # at once the storm is exposed for exposed-ticks and takes exposed-damage-multiplier times the
    # damage.
    injury-ticks: 200
    escape-ticks: 800
    exposed-ticks: 160
    exposed-damage-multiplier: 2.0
    # The Destroyer and the Devourer fall and play dead once, at play-dead-threshold of their
    # health, for play-dead-ticks (taking 1.5x damage) before they rise again. 0 disables it.
    play-dead-threshold: 0.15
    play-dead-ticks: 200
    max-phantoms: 4               # phantoms circling the Destroyer and the Devourer
    # Its big attacks, one every cooldown-ticks (+0-10 s), never the same twice in a row: Cataclysmic
    # Roar (a shockwave along the ground: jump it), Skull Barrage (from the second form), Debris Rain
    # and Abyssal Eruption (from the third) and Singularity (Destroyer and Devourer).
    specials:
      enabled: true
      cooldown-ticks: 500
      roar-damage: 10.0
      debris-damage: 8.0
      singularity-damage: 16.0
      eruption-damage: 12.0
    # What it calls to its side, one call every cooldown-ticks (+0-10 s), at most max alive: the
    # Sickened Horde (horde-size mobs), the Withered Symbiont (from the third form) and a phantom
    # swarm (Destroyer and Devourer). They all fall with the storm.
    summons:
      enabled: true
      cooldown-ticks: 700
      max: 8
      symbiont-health: 220.0
      horde-size: 4
    sickness:
      enabled: true               # hunger, then weakness, then wither for players near it
      sicken-mobs: true           # hostile mobs near it are sickened and fight for it
      max-sickened-mobs: 12
    # What swallowing each thing adds towards the next form.
    consume-points:
      block: 1
      mob: 6
      player: 10
      item: 1
    summon:
      enabled: true
      core-block: CRYING_OBSIDIAN
      forming-ticks: 220          # the vortex it is born out of, invulnerable
      explosion-power: 7.0        # the blast when it is born (a Wither's is 7)
    # Each form: its size (1.0 is the mod's own: the Destroyer is ~56 blocks wide, the Devourer
    # ~110), its health over the base health, how much it must swallow to grow out of it, how far
    # its beams reach and how high it flies.
    forms:
      hunchback:
        scale: 1.0
        health-multiplier: 1.0
        evolve-at: 200
        beam-range: 20.0
        fly-height: 5.0
      growing:
        scale: 1.0
        health-multiplier: 1.5
        evolve-at: 600
        beam-range: 26.0
        fly-height: 6.0
      pregnant:
        scale: 1.0
        health-multiplier: 2.0
        evolve-at: 1500
        beam-range: 32.0
        fly-height: 8.0
      destroyer:
        scale: 1.0
        health-multiplier: 3.5
        evolve-at: 6000
        beam-range: 64.0
        fly-height: 28.0
      devourer:
        scale: 1.0
        health-multiplier: 5.0
        evolve-at: 0              # the last form: it does not grow any further
        beam-range: 96.0
        fly-height: 40.0
    death-messages:
      - "&5%player% &7was devoured by the &5Wither Storm"
      - "&5%player% &7was pulled into the &5Wither Storm&7's tractor beam"
      - "&5%player% &7could not outrun the &5Wither Storm"

