# =============================================================================
# Multiverse Merchant trades (Wandering Trader)
# Kept for reference / future config-driven trades
# =============================================================================
# ---------------------------------------------------------------------------
# Stands: awakened by the Stand Arrow in players who drank the Bearer's Elixir
# ---------------------------------------------------------------------------
# Sneak + F summons or sends the Stand back; F uses its ability; sneak + left click with an
# empty hand uses the second one (time stop). /stand shows a player's Stand. Weights decide
# how often each Stand is awakened (0 = never).
stands:
  enabled: true
  hermit-purple:
    weight: 30
    cooldown-seconds: 30
    reveal-radius: 48.0
    reveal-seconds: 10
  magicians-red:
    weight: 25
    cooldown-seconds: 12
    fireballs: 3
    fire-damage: 6.0
  crazy-diamond:
    weight: 18
    cooldown-seconds: 30
    heal: 8.0
    repair-fraction: 0.5
    range: 6.0
  killer-queen:
    weight: 14
    # First bomb: every player the user hits also takes an explosion.
    explosion-damage: 4.0
    explosion-cooldown-ms: 1500
    require-summoned: false   # true: only while the Stand is out
    include-mobs: false       # true: mobs explode too, not only players
    # Sheer Heart Attack (/stand sha): an immortal bomb that rolls after the chosen player,
    # through any block, keeping its chunk loaded. 0 lifetime = until it arrives.
    sha-cooldown-seconds: 300
    sha-speed: 0.12
    sha-damage: 18.0
    sha-reach: 1.2
    sha-lifetime-seconds: 0
  star-platinum:
    weight: 10
    cooldown-seconds: 20
    range: 4.0
    barrage-hits: 10
    barrage-damage: 1.5
    barrage-finisher: 5.0
    time-stop-seconds: 1.5
    time-stop-radius: 10.0
    time-stop-cooldown-seconds: 120
  the-world:
    weight: 3
    cooldown-seconds: 20
    range: 4.5
    barrage-hits: 10
    barrage-damage: 1.8
    barrage-finisher: 6.0
    time-stop-seconds: 3.0
    time-stop-radius: 14.0
    time-stop-cooldown-seconds: 150

# ---------------------------------------------------------------------------
# Vampires: whoever drinks the Bearer's Elixir (DIO's blood)
# ---------------------------------------------------------------------------
vampire:
  # True damage dealt every check under the open sky in daytime: it ignores armour,
  # Resistance, enchantments, absorption and totems.
  sun-damage: 2.0
  sun-check-ticks: 20
  # Rain clouds hide the sun, as they do for zombies.
  rain-protects: true
  # Strength and Speed at night, night vision always.
  night-perks: true
  # Share of the melee damage dealt that heals the vampire.
  lifesteal: 0.15
  sun-death-messages:
    - "&6%player% &cturned to ashes under the sun"
    - "&6%player% &cforgot that dawn never forgives the children of the night"
    - "&6%player% &ctried to defy the sun like DIO... and the sun won"

merchant:
  enabled: true
  spawn-chance: 0.3
  custom-name: "&6Multiverse Merchant"
  name-visible: true
  trades:
    scooby-cookies:
      enabled: true
      price:
        material: "DIAMOND"
        amount: 20
      result-amount: 5
      max-uses: 999
    excalibur:
      enabled: true
      price:
        - material: "NETHER_STAR"
          amount: 16
          custom-item: "starcore"
        - material: "NETHERITE_INGOT"
          amount: 32
      max-uses: 1
    ice-crown:
      enabled: true
      price:
        - material: "NETHER_STAR"
          amount: 48
        - material: "BLUE_ICE"
          amount: 64
      max-uses: 1
    wirts-lantern:
      enabled: true
      price:
        - material: "SOUL_SAND"
          amount: 32
        - material: "SOUL_SOIL"
          amount: 16
      max-uses: 1
