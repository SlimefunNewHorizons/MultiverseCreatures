# Sitio de GitHub Pages: la pagina de presentacion, el visor 3D y los ataques animados.
#
# QUE HACE
#   Ejecuta los tests (que exportan los modelos a target/stand-viewer/models.json), genera las skins
#   pintadas de los Stands (website/models/stand-skins), arma el sitio con website/build.py y lo publica.
#   Todo el sitio vive en website/: la pagina en website/public, el script y la salida (website/_site).
name: Sitio (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/main/resources/stands/**'
      - 'src/main/resources/witherstorm/**'
      - 'src/main/resources/monster/**'
      - 'src/main/java/com/Chagui68/entities/monster/**'
      - 'src/main/java/com/Chagui68/stand/**'
      - 'src/main/java/com/Chagui68/entities/boss/witherstorm/**'
      - 'src/test/java/com/Chagui68/stand/**'
      - 'src/test/java/com/Chagui68/entities/boss/witherstorm/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Exportar los modelos (mvn test)
        run: mvn -B -ntp test
      - name: Skins pintadas de los Stands
        run: |
          python3 -m pip install --quiet pillow
          python3 website/models/stand-skins/split.py
          python3 website/models/stand-skins/paint.py
      - name: Armar el sitio
        run: python3 website/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
