<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Viewer · MultiverseCreatures</title>
<meta name="description" content="Every Stand and every form of the Wither Storm in 3D, with its poses, animations, tractor beams and hitboxes.">
<link rel="icon" href="../icon.svg">
<style>
  :root {
    --bg: #101216; --viewport: #15171c; --panel: #1b1e25; --panel-2: #232731; --line: #2e333f;
    --text: #e6e8ec; --muted: #9aa3b2; --faint: #6b7383; --accent: #f2c230; --accent-ink: #1b1600;
    --radius: 8px; --sidebar: 300px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-columns: var(--sidebar) 1fr; overflow: hidden; }

  /* ---------------------------------------------------------------- sidebar */
  aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel);
    border-right: 1px solid var(--line); }
  header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 16px; color: var(--accent); letter-spacing: .2px; }
  header .back { display: inline-block; margin-top: 4px; color: var(--muted); font-size: 12px; text-decoration: none; }
  header .back:hover { color: var(--accent); }
  header p { margin: 2px 0 0; color: var(--faint); font-size: 12px; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0 12px; }
  section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  section:last-child { border-bottom: 0; }
  h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); }
  .off { display: none !important; }

  input[type=search], select, button { width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; }
  input[type=search]:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { cursor: pointer; }
  button:hover { border-color: #444b5a; }

  /* model list */
  #models { position: relative; margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .group { margin: 8px 0 2px; color: var(--faint); font-size: 11px; display: flex; justify-content: space-between; }
  .group:first-child { margin-top: 0; }
  .model { text-align: left; border: 1px solid transparent; background: transparent; padding: 6px 9px; color: var(--text); }
  .model:hover { background: var(--panel-2); border-color: transparent; }
  .model[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .empty { color: var(--faint); padding: 6px 2px; }

  /* fields */
  .field { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 8px; margin-top: 6px; }
  .field:first-of-type { margin-top: 0; }
  .field span { color: var(--muted); }

  /* toggles */
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0;
    color: var(--text); cursor: pointer; }
  .toggle small { display: block; color: var(--faint); font-size: 11px; }
  .toggle input { appearance: none; flex: none; width: 32px; height: 18px; border-radius: 9px; background: #3a404c;
    position: relative; cursor: pointer; transition: background .15s; margin: 0; }
  .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: #cfd3da; transition: transform .15s; }
  .toggle input:checked { background: var(--accent); }
  .toggle input:checked::after { transform: translateX(14px); background: var(--accent-ink); }
  .toggle input:disabled { opacity: .4; cursor: not-allowed; }
  .toggle input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .segmented { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .segmented button { padding: 6px 0; }

  /* stats */
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .note { margin: 8px 0 0; color: var(--faint); font-size: 11px; }
  code { font: 11px ui-monospace, Consolas, monospace; color: var(--muted); }

  /* ---------------------------------------------------------------- viewport */
  main { position: relative; min-width: 0; min-height: 0; background: var(--viewport); }
  main canvas { display: block; position: absolute; inset: 0; }
  .chip { position: absolute; top: 12px; left: 12px; padding: 6px 10px; border-radius: var(--radius);
    background: rgba(16, 18, 22, .78); border: 1px solid var(--line); pointer-events: none; max-width: calc(100% - 24px); }
  .chip b { display: block; font-size: 14px; }
  .chip span { color: var(--muted); font-size: 12px; }
  .hint { position: absolute; right: 12px; bottom: 10px; color: var(--faint); font-size: 11px; pointer-events: none; }
  /* The Darkness a player is left in as the Monster vanishes. */
  #dark { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s;
    background: radial-gradient(circle, rgba(0,0,0,.35) 0%, rgba(0,0,0,.92) 70%); }
  #status { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
    color: var(--muted); }
  #status code { font-size: 12px; color: var(--accent); }

  /* ---------------------------------------------------------------- narrow screens */
  @media (max-width: 760px) {
    body { display: flex; flex-direction: column-reverse; overflow: auto; height: auto; min-height: 100%; }
    main { height: 58vh; flex: none; }
    aside { border-right: 0; border-top: 1px solid var(--line); }
    .scroll { overflow: visible; }
    #models { max-height: 220px; overflow-y: auto; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Model Viewer</h1>
    <a class="back" href="../">&larr; MultiverseCreatures</a>
    <p>MultiverseCreatures · Stands and bosses as the game draws them</p>
  </header>
  <div class="scroll">
    <section>
      <h2>Model</h2>
      <input type="search" id="search" placeholder="Search models" autocomplete="off" aria-label="Search models">
      <div id="models" role="list"></div>
    </section>
    <section>
      <h2>Pose</h2>
      <label class="field"><span>Pose</span><select id="pose" autocomplete="off"></select></label>
      <label class="field" id="animLabel"><span>Animation</span><select id="anim" autocomplete="off"></select></label>
    </section>
    <section>
      <h2>Show</h2>
      <label class="toggle"><span>Turn slowly</span><input type="checkbox" id="spin" checked></label>
      <label class="toggle" id="allLabel"><span>All Stands side by side</span><input type="checkbox" id="all"></label>
      <label class="toggle" id="paintedLabel"><span>Painted skins<small>website/models/stand-skins on The World's eleven heads</small></span><input type="checkbox" id="painted"></label>
      <label class="toggle" id="playerLabel"><span>Player<small>A player standing in front, to scale</small></span><input type="checkbox" id="player" checked></label>
      <label class="toggle" id="beamLabel"><span>Tractor beams<small>At each form's default reach</small></span><input type="checkbox" id="beams" checked></label>
      <label class="toggle" id="boxLabel"><span>Hitboxes<small>The mass (yellow) and one per head (blue)</small></span><input type="checkbox" id="boxes"></label>
    </section>
    <section>
      <h2>Camera</h2>
      <div class="segmented">
        <button id="front">Front</button><button id="side">Side</button><button id="back">Back</button><button id="top">Top</button>
      </div>
    </section>
    <section>
      <h2>Details</h2>
      <dl id="stats"></dl>
      <p class="note" id="note"></p>
    </section>
  </div>
</aside>
<main id="viewport">
  <div class="chip"><b id="chipName">Loading…</b><span id="chipGroup"></span></div>
  <div class="hint">Drag to orbit · right-drag to pan · scroll to zoom</div>
  <div id="dark"></div>
  <div id="status" class="off"></div>
</main>
<!-- Two ways to get the data. On the site, website/build.py writes models.json and skins/ next to this
     page. From a checkout, `mvn test` writes target/stand-viewer/models.json and models.js: opened straight
     from disk (file://) the page cannot fetch files, but it does run these scripts. Missing ones are skipped. -->
<script>
if (location.protocol === "file:") {
  for (const f of ["models.js", "textures.js"]) document.write('<script src="../../../target/stand-viewer/' + f + '"><\/script>');
}
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const viewport = document.getElementById("viewport");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
viewport.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171c);
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 4000);
function resize() {
  const w = Math.max(1, viewport.clientWidth), h = Math.max(1, viewport.clientHeight);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
resize();
new ResizeObserver(resize).observe(viewport);
camera.position.set(0, 1.2, 4.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x404050, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(3, 6, 4);
sun.castShadow = true;
scene.add(sun);
let grid = new THREE.GridHelper(12, 12, 0x3a404c, 0x262a33);
scene.add(grid);

const loader = new THREE.TextureLoader();
loader.setCrossOrigin("anonymous");
const skins = new Map();
function skin(url) {
  if (!skins.has(url)) {
    const tex = loader.load(url, undefined, undefined, () => { tex.userData.failed = true; refresh(); });
    tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.colorSpace = THREE.SRGBColorSpace;
    skins.set(url, tex);
  }
  return skins.get(url);
}

// A player head: a 0.5 cube hanging below its anchor, its skin's face on -z.
// Box faces are +x, -x, +y, -y, +z, -z; each gets its 8x8 square of the 64x64 skin.
function headGeometry(layer) {
  const size = layer ? 0.5 * 1.125 : 0.5;
  const g = new THREE.BoxGeometry(size, size, size);
  g.translate(0, -0.25, 0);
  const ox = layer ? 32 : 0;
  const faces = [[0, 8], [16, 8], [8, 0], [16, 0], [24, 8], [8, 8]];
  const uv = g.attributes.uv;
  faces.forEach(([px, py], f) => {
    const u0 = (px + ox) / 64, u1 = (px + ox + 8) / 64, v0 = 1 - py / 64, v1 = 1 - (py + 8) / 64;
    const quad = [[u0, v0], [u1, v0], [u0, v1], [u1, v1]];
    for (let i = 0; i < 4; i++) uv.setXY(f * 4 + i, quad[i][0], quad[i][1]);
  });
  return g;
}
const HEAD = headGeometry(false), HAT = headGeometry(true);

// A player, the way the game draws one: each part a box with its two layers of a 64x64 skin, facing -z,
// feet on y = 0. Sizes and offsets are skin pixels; [w, h, d, x, y, u, v, overlay u, overlay v].
const STEVE = "https://textures.minecraft.net/texture/31f477eb1a7beee631c2ca64d06f8f68fa93a3386d04452ab27f43acdf1b60cb";
const PLAYER_PARTS = [
  [8, 8, 8, 0, 24, 0, 0, 32, 0],      // head, hat
  [8, 12, 4, 0, 12, 16, 16, 16, 32],  // body, jacket
  [4, 12, 4, 6, 12, 40, 16, 40, 32],  // right arm (+x while it faces -z)
  [4, 12, 4, -6, 12, 32, 48, 48, 48], // left arm
  [4, 12, 4, 2, 0, 0, 16, 0, 32],     // right leg
  [4, 12, 4, -2, 0, 16, 48, 0, 48],   // left leg
];
function cuboid(w, h, d, u, v, grow) {
  const g = new THREE.BoxGeometry((w + grow) / 16, (h + grow) / 16, (d + grow) / 16);
  // Box faces are +x, -x, +y, -y, +z, -z: the skin's right side, left side, top, bottom, back and front.
  const faces = [[u, v + d, d, h], [u + d + w, v + d, d, h], [u + d, v, w, d], [u + d + w, v, w, d],
    [u + 2 * d + w, v + d, w, h], [u + d, v + d, w, h]];
  const uv = g.attributes.uv;
  faces.forEach(([px, py, fw, fh], f) => {
    const u0 = px / 64, u1 = (px + fw) / 64, v0 = 1 - py / 64, v1 = 1 - (py + fh) / 64;
    const quad = [[u0, v0], [u1, v0], [u0, v1], [u1, v1]];
    for (let i = 0; i < 4; i++) uv.setXY(f * 4 + i, quad[i][0], quad[i][1]);
  });
  return g;
}
function buildPlayer(at) {
  const tex = skin(STEVE), failed = tex.userData.failed;
  const base = new THREE.MeshStandardMaterial(failed ? { color: 0x3a7bd5 } : { map: tex });
  const over = new THREE.MeshStandardMaterial({ map: tex, transparent: true, alphaTest: 0.5 });
  const group = new THREE.Group();
  for (const [w, h, d, x, y, u, v, ou, ov] of PLAYER_PARTS) {
    const part = new THREE.Mesh(cuboid(w, h, d, u, v, 0), base);
    part.position.set(x / 16, (y + h / 2) / 16, 0);
    group.add(part);
    if (!failed) {
      const layer = new THREE.Mesh(cuboid(w, h, d, ou, ov, w === 8 && h === 8 ? 1 : 0.5), over);
      layer.position.copy(part.position);
      group.add(layer);
    }
  }
  // The game draws a player at 0.9375 of its model: 1.875 blocks tall. Turned round to face +z,
  // then by the scene's yaw (180 faces the model).
  group.scale.setScalar(0.9375);
  group.rotation.y = Math.PI + THREE.MathUtils.degToRad(at[3] || 0);
  group.position.set(at[0], at[1], at[2]);
  return group;
}

// What a concept pose rests on, from its scene: the blocks round it (stone you can see through, chests,
// a pit in the floor), or for an older scene without blocks a ceiling or a chest under its anchor.
function propsOf(scene) {
  const group = new THREE.Group(), [x, y, z] = scene.anchor;
  const stone = new THREE.MeshStandardMaterial(
      { color: 0x6b7078, transparent: true, opacity: 0.3, depthWrite: false, side: THREE.DoubleSide });
  const edges = new THREE.LineBasicMaterial({ color: 0xa0a6b0, transparent: true, opacity: 0.55 });
  const block = (x0, y0, z0, w, h, d, material) => {
    const geometry = new THREE.BoxGeometry(w, h, d);
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x0 + w / 2, y0 + h / 2, z0 + d / 2);
    const lines = new THREE.LineSegments(new THREE.EdgesGeometry(geometry), edges);
    lines.position.copy(mesh.position);
    group.add(mesh, lines);
  };
  // A chest (or a double chest): planks, a darker lid line and the latch on its front (+z).
  const chest = (x0, y0, z0, w, d) => {
    const body = new THREE.Mesh(new THREE.BoxGeometry(w - 0.125, 0.875, d - 0.125),
        new THREE.MeshStandardMaterial({ color: 0x9c6b30, roughness: 0.9 }));
    body.position.set(x0 + w / 2, y0 + 0.4375, z0 + d / 2);
    const lid = new THREE.Mesh(new THREE.BoxGeometry(w - 0.12, 0.04, d - 0.12), new THREE.MeshStandardMaterial({ color: 0x5a3a16 }));
    lid.position.set(x0 + w / 2, y0 + 0.6, z0 + d / 2);
    const latch = new THREE.Mesh(new THREE.BoxGeometry(0.125, 0.25, 0.06), new THREE.MeshStandardMaterial({ color: 0xc8c8c8 }));
    latch.position.set(x0 + w / 2, y0 + 0.55, z0 + d - 0.04);
    group.add(body, lid, latch);
  };
  if (scene.world) {
    for (const [x0, y0, z0, x1, y1, z1, isChest] of scene.world.blocks) {
      if (isChest) chest(x0, y0, z0, x1 - x0, z1 - z0);
      else block(x0, y0, z0, x1 - x0, y1 - y0, z1 - z0, stone);
    }
    const pit = new THREE.MeshBasicMaterial({ color: 0x050608, transparent: true, opacity: 0.55, depthWrite: false });
    for (const [hx, hy, hz] of scene.world.holes) block(hx, hy, hz, 1, 1, 1, pit);
  } else if (scene.place === "ceiling") {
    block(x - 2.5, y, z - 2.5, 5, 1, 5, stone);
  } else if (scene.place === "block") {
    chest(x - 0.5, y - 1, z - 0.5, 1, 1);
  }
  return group;
}

function place(object, p) {
  object.position.set(p.t[0], p.t[1], p.t[2]);
  object.quaternion.set(p.q[0], p.q[1], p.q[2], p.q[3]);
  object.scale.set(p.s[0], p.s[1], p.s[2]);
}

// ------------------------------------------------------------------ block displays

// A block display draws its block in the unit cube from its origin; a skull item hangs below it.
const BLOCK = new THREE.BoxGeometry(1, 1, 1).translate(0.5, 0.5, 0.5);
const SKULL = new THREE.BoxGeometry(0.5, 0.5, 0.5).translate(0, -0.25, 0);
// The blocks the forms are drawn with: a base and a speckle colour for a 16x16 texture.
const BLOCKS = {
  OBSIDIAN: [0x0f0b17, 0x2c1f45], BLACK_CONCRETE: [0x08090d, 0x14161c], CRYING_OBSIDIAN: [0x200a3a, 0x9b3cff],
  BLACKSTONE: [0x2a2329, 0x3d343c], POLISHED_BLACKSTONE: [0x353038, 0x48414b], GRAY_CONCRETE: [0x36393d, 0x44474c],
  PURPLE_CONCRETE: [0x64209c, 0x7a2bbd], MAGENTA_CONCRETE: [0xa9309f, 0xd65ccb], AMETHYST_BLOCK: [0x8561bf, 0xb08ce8],
  LIGHT_GRAY_CONCRETE: [0x7d7d73, 0x8c8c82], WHITE_CONCRETE: [0xcfd5d6, 0xf0f6f6], COMMAND_BLOCK: [0xb5784a, 0x8a9696],
};
const blockMaterials = new Map();
// The game's own textures, copied out of a local Minecraft client by website/textures.ps1.
// Without them the blocks fall back to the flat stand-ins below.
const VANILLA = new URL("../../../target/stand-viewer/textures/", location.href);
const vanillaTextures = new Map();
// The game's textures are Mojang's and never published: only a local checkout looks for them.
const LOCAL = location.protocol === "file:" || ["localhost", "127.0.0.1"].includes(location.hostname);
function vanilla(name) {
  if (!LOCAL && !(window.STAND_VIEWER_TEXTURES && window.STAND_VIEWER_TEXTURES[name])) return null;
  if (!vanillaTextures.has(name)) {
    const embedded = window.STAND_VIEWER_TEXTURES && window.STAND_VIEWER_TEXTURES[name];
    const tex = loader.load(embedded || new URL(name + ".png", VANILLA).href, t => {
      // Animated textures (the command block's) are frame strips: show the first frame.
      const { width, height } = t.image;
      if (height > width) { t.repeat.set(1, width / height); t.offset.set(0, 1 - width / height); }
    }, undefined, () => { tex.userData.failed = true; blockMaterials.clear(); skullMaterials = null; refresh(); });
    tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.colorSpace = THREE.SRGBColorSpace;
    vanillaTextures.set(name, tex);
  }
  const tex = vanillaTextures.get(name);
  return tex.userData.failed ? null : tex;
}
// Which texture each face of a block uses, in BoxGeometry's order: +x, -x, +y, -y, +z, -z.
// A command block faces north (-z) with its back to the south.
function blockFaces(name) {
  const lower = name.toLowerCase();
  if (name === "COMMAND_BLOCK") {
    const side = "command_block_side";
    return [side, side, side, side, "command_block_back", "command_block_front"];
  }
  if (name === "BLACKSTONE") return [lower, lower, "blackstone_top", "blackstone_top", lower, lower];
  return [lower, lower, lower, lower, lower, lower];
}
function vanillaMaterial(name, glow) {
  const maps = blockFaces(name).map(vanilla);
  if (maps.some(m => !m)) return null;
  // Brightness 15 in the game draws a block fully lit, whatever the light round it: unlit here.
  return maps.map(map => glow ? new THREE.MeshBasicMaterial({ map }) : new THREE.MeshStandardMaterial({ map, roughness: 0.9 }));
}
function seeded(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }
function texture(draw) {
  const c = document.createElement("canvas"); c.width = c.height = 16;
  draw(c.getContext("2d"));
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const hex = n => "#" + n.toString(16).padStart(6, "0");
function blockMaterial(name, glow) {
  const key = name + glow;
  if (!blockMaterials.has(key)) {
    const real = vanillaMaterial(name, glow);
    if (real) { blockMaterials.set(key, real); return real; }
    const [base, speck] = BLOCKS[name] || [0x101010, 0x202020];
    const rand = seeded([...name].reduce((a, ch) => a * 31 + ch.charCodeAt(0), 7));
    const map = texture(g => {
      g.fillStyle = hex(base); g.fillRect(0, 0, 16, 16);
      g.fillStyle = hex(speck);
      if (name === "COMMAND_BLOCK") {
        g.fillRect(3, 3, 10, 10); g.fillStyle = hex(base); g.fillRect(5, 5, 6, 6);
      } else {
        for (let i = 0; i < 40; i++) g.fillRect(Math.floor(rand() * 16), Math.floor(rand() * 16), 1 + Math.floor(rand() * 2), 1);
      }
    });
    blockMaterials.set(key, new THREE.MeshStandardMaterial(glow
        ? { map, emissive: 0xffffff, emissiveMap: map, emissiveIntensity: 0.9 }
        : { map, roughness: 0.9 }));
  }
  return blockMaterials.get(key);
}
// The skull item the game draws: the wither skeleton's head, laid out on its 64x32 texture the way a
// player head is on a skin, face on -z.
const SKULL_TEXTURED = (() => {
  const g = new THREE.BoxGeometry(0.5, 0.5, 0.5).translate(0, -0.25, 0);
  const faces = [[0, 8], [16, 8], [8, 0], [16, 0], [24, 8], [8, 8]];
  const uv = g.attributes.uv;
  faces.forEach(([px, py], f) => {
    const u0 = px / 64, u1 = (px + 8) / 64, v0 = 1 - py / 32, v1 = 1 - (py + 8) / 32;
    const quad = [[u0, v0], [u1, v0], [u0, v1], [u1, v1]];
    for (let i = 0; i < 4; i++) uv.setXY(f * 4 + i, quad[i][0], quad[i][1]);
  });
  return g;
})();
// Without the real texture: charcoal sides, its face (on -z) with the two hollow eyes and the grin.
let skullMaterials;
function skullFaces() {
  if (!skullMaterials) {
    const real = vanilla("wither_skeleton");
    if (real) {
      skullMaterials = new THREE.MeshStandardMaterial({ map: real, roughness: 0.9 });
      return skullMaterials;
    }
    const side = texture(g => { g.fillStyle = "#2b2b2b"; g.fillRect(0, 0, 16, 16); g.fillStyle = "#3a3a3a";
      for (let i = 0; i < 16; i += 3) g.fillRect(i, (i * 7) % 16, 2, 1); });
    const face = texture(g => {
      g.fillStyle = "#2f2f2f"; g.fillRect(0, 0, 16, 16);
      g.fillStyle = "#0a0a0a"; g.fillRect(3, 5, 4, 3); g.fillRect(9, 5, 4, 3); g.fillRect(4, 11, 8, 2);
      g.fillStyle = "#4a4a4a"; g.fillRect(5, 11, 1, 2); g.fillRect(8, 11, 1, 2); g.fillRect(10, 11, 1, 2);
    });
    const plain = new THREE.MeshStandardMaterial({ map: side, roughness: 0.9 });
    skullMaterials = [plain, plain, plain, plain, plain, new THREE.MeshStandardMaterial({ map: face, roughness: 0.9 })];
  }
  return skullMaterials;
}

function buildBlocks(model, pieces) {
  const group = new THREE.Group();
  const meshes = [];
  pieces.forEach(p => {
    if (!p) { meshes.push(null); return; }
    const skull = p.k === "s" ? skullFaces() : null;
    const mesh = skull ? new THREE.Mesh(Array.isArray(skull) ? SKULL : SKULL_TEXTURED, skull)
        : new THREE.Mesh(BLOCK, blockMaterial(p.m, p.g));
    place(mesh, p);
    group.add(mesh);
    meshes.push(mesh);
  });
  group.userData.meshes = meshes;
  return group;
}

function beamsOf(model, pose) {
  const group = new THREE.Group();
  const material = new THREE.MeshBasicMaterial({ color: 0xb06cff, transparent: true, opacity: 0.16,
    depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
  for (const b of (model.beams && model.beams[pose]) || []) {
    const cone = new THREE.Mesh(new THREE.CylinderGeometry(b.r, 0.12, b.l, 24, 1, true), material);
    const dir = new THREE.Vector3(...b.d);
    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    cone.position.set(...b.o).addScaledVector(dir, b.l / 2);
    group.add(cone);
  }
  return group;
}

function hitboxesOf(model) {
  const group = new THREE.Group();
  (model.hitboxes || []).forEach((b, i) => {
    const box = new THREE.Box3(new THREE.Vector3(b[0], b[1], b[2]), new THREE.Vector3(b[3], b[4], b[5]));
    group.add(new THREE.Box3Helper(box, i === 0 ? 0xf2c230 : 0x3fd7ff));
  });
  return group;
}

// ------------------------------------------------------------------ stands

// A Stand painted in website/models/stand-skins wears The World's eleven heads with its own skins.
function painted(stand) {
  const files = paintedBox.checked && manifest && manifest[stand.key];
  const base = files && data.stands.find(isStand);
  return base ? { files, base } : null;
}

function buildStand(stand, poseName) {
  if (stand.kind === "blocks") {
    const group = new THREE.Group();
    const body = buildBlocks(stand, stand.poses[poseName] || stand.poses.idle);
    group.add(body);
    group.userData.meshes = body.userData.meshes;
    if (beamBox.checked) group.add(beamsOf(stand, poseName));
    if (hitBox.checked) group.add(hitboxesOf(stand));
    return group;
  }
  const group = new THREE.Group();
  const paint = painted(stand);
  const pieces = paint
      ? (paint.base.poses[poseName] || paint.base.poses.idle).map((p, i) => ({ ...p,
          skin: (window.STAND_VIEWER_PAINTED && window.STAND_VIEWER_PAINTED[paint.files[i]]) || skinBase + paint.files[i] }))
      : (stand.poses[poseName] || stand.poses.idle);
  const meshes = [];
  for (const p of pieces) {
    const tex = skin(p.skin);
    const failed = tex.userData.failed;
    const mesh = new THREE.Group();
    mesh.add(new THREE.Mesh(HEAD, new THREE.MeshStandardMaterial(failed ? { color: 0xd4a62a } : { map: tex })));
    if (!failed) {
      mesh.add(new THREE.Mesh(HAT, new THREE.MeshStandardMaterial({ map: tex, transparent: true, alphaTest: 0.5 })));
    }
    if (p.m) {
      // The export's own matrix, row major, shear and all.
      mesh.matrixAutoUpdate = false;
      mesh.matrix.set(...p.m, 0, 0, 0, 1);
    } else {
      place(mesh, p);
    }
    group.add(mesh);
    meshes.push(mesh);
  }
  group.userData.meshes = meshes;
  const scene = stand.scenes && stand.scenes[poseName];
  if (scene) {
    if (playerBox.checked) group.add(group.userData.player = buildPlayer(scene.player));
    group.add(propsOf(scene));
  }
  return group;
}

// ------------------------------------------------------------------ the Monster's visit

// The Monster's rig, turned from the export into matrices once: each part's parent and pivot, each
// head's part and rest matrix. An animation frame is the rig's parameters, posed here the way the
// game's MonsterRig poses it: T(anchor) * yaw * T(lift) * tilt, then every part about its pivot.
const rad = THREE.MathUtils.degToRad;
let rigCache = null;
function monsterRig(stand) {
  if (!rigCache || rigCache.stand !== stand) {
    const rest = stand.rig.rest.map(r => new THREE.Matrix4().set(...r, 0, 0, 0, 1));
    rigCache = { stand, rest, parts: stand.rig.parts, owners: stand.rig.owners };
  }
  return rigCache;
}
// Turns by [pitch, yaw, roll] degrees: yaw, then pitch, then roll.
function turnBy(p, y, r) {
  return new THREE.Matrix4().makeRotationY(rad(y))
      .multiply(new THREE.Matrix4().makeRotationX(rad(p))).multiply(new THREE.Matrix4().makeRotationZ(rad(r)));
}
// Frame layout: phase, shown (1) or not, anchor x y z, yaw, lift x y z, tilt p y r, the player's yaw,
// then p y r per part, then its face's pitch and size. Phases as the game's MonsterScript has them: in
// "scream" only its face is drawn, its eyes at the anchor, in the player's face.
const PHASES = ["lurk", "rise", "move", "scream", "blink", "hide", "gone"];
function poseFrame(stand, f, meshes, player) {
  const rig = monsterRig(stand);
  const shown = f[1] === 1 && PHASES[f[0]] !== "gone";
  const faceSize = f[f.length - 1];
  if (player) player.rotation.y = Math.PI + rad(f[12]);
  // The Darkness and Blindness it leaves the player in as it vanishes.
  document.getElementById("dark").style.opacity = PHASES[f[0]] === "gone" ? 1 : 0;
  const owners = rig.parts.map(([name]) => name);
  const head = owners.indexOf("HEAD"), jaw = owners.indexOf("JAW");
  meshes.forEach((m, h) => {
    m.visible = shown && (faceSize <= 0 || rig.owners[h] === head || rig.owners[h] === jaw);
  });
  if (!shown) return;
  const body = new THREE.Matrix4().makeTranslation(f[6], f[7], f[8]).multiply(turnBy(f[9], f[10], f[11]));
  const chain = root => {
    const world = [];
    rig.parts.forEach(([, parent, px, py, pz], i) => {
      const j = 13 + i * 3;
      world.push((parent < 0 ? root : world[parent]).clone()
          .multiply(new THREE.Matrix4().makeTranslation(px, py, pz))
          .multiply(turnBy(f[j], f[j + 1], f[j + 2]))
          .multiply(new THREE.Matrix4().makeTranslation(-px, -py, -pz)));
    });
    return world;
  };
  let root;
  if (faceSize > 0) {
    // Its eyes at the anchor, turned and tilted to the player, scaled round them.
    const eye = new THREE.Vector3(...stand.rig.eyes).applyMatrix4(chain(body)[head]);
    root = new THREE.Matrix4().makeTranslation(f[2], f[3], f[4])
        .multiply(new THREE.Matrix4().makeRotationY(rad(f[5])))
        .multiply(new THREE.Matrix4().makeRotationX(rad(f[f.length - 2])))
        .multiply(new THREE.Matrix4().makeScale(faceSize, faceSize, faceSize))
        .multiply(new THREE.Matrix4().makeTranslation(-eye.x, -eye.y, -eye.z))
        .multiply(body);
  } else {
    root = new THREE.Matrix4().makeTranslation(f[2], f[3], f[4])
        .multiply(new THREE.Matrix4().makeRotationY(rad(f[5]))).multiply(body);
  }
  const world = chain(root);
  meshes.forEach((m, h) => m.matrix.copy(world[rig.owners[h]]).multiply(rig.rest[h]));
}

// The Monster's visits live in a file of their own, fetched the first time the Monster is shown.
let monsterAnims = null, monsterAnimsLoading = false;
function loadMonsterAnims(stand) {
  if (monsterAnims || monsterAnimsLoading || typeof stand.anims !== "string") return;
  monsterAnimsLoading = true;
  firstJson(stand.anims, "../../../target/stand-viewer/" + stand.anims).then(({ j }) => {
    monsterAnims = j;
    fillPoses();
    refresh();
  }).catch(() => { monsterAnimsLoading = false; });
}
// What each behaviour is called in the menu.
const BEHAVIORS = { "walk": "walk: gets up and walks over", "coffin-rise": "coffin rise", "crawl-rush": "crawl rush",
  "ceiling-scuttle": "ceiling scuttle", "blink": "blink", "peek-and-hide": "peek and hide" };

let data, manifest, current = new THREE.Group();
scene.add(current);
const modelList = document.getElementById("models"), search = document.getElementById("search");
const poseSelect = document.getElementById("pose");
const animSelect = document.getElementById("anim");
const allBox = document.getElementById("all"), spinBox = document.getElementById("spin");
const paintedBox = document.getElementById("painted"), playerBox = document.getElementById("player");
const beamBox = document.getElementById("beams"), hitBox = document.getElementById("boxes");
let frame = 0, clock = 0, selectedIndex = 0;

const selected = () => data.stands[selectedIndex];
const groupOf = s => s.group || "Stands";
// Stands are the rigged eleven-head figures; other head models (the concepts) carry a group of their own.
const isStand = s => s.kind === "heads" && !s.group;
// "Wither Storm: The Hunchback" is listed under its group as "The Hunchback".
const shortName = s => s.name.startsWith(groupOf(s) + ": ") ? s.name.slice(groupOf(s).length + 2) : s.name;

/** The model list, grouped, filtered by the search box, with the selected model highlighted. */
function fillModels() {
  const query = search.value.trim().toLowerCase();
  modelList.innerHTML = "";
  const groups = new Map();
  data.stands.forEach((s, i) => {
    if (query && !s.name.toLowerCase().includes(query) && !groupOf(s).toLowerCase().includes(query)) return;
    if (!groups.has(groupOf(s))) groups.set(groupOf(s), []);
    groups.get(groupOf(s)).push(i);
  });
  for (const [label, indices] of groups) {
    const title = document.createElement("div");
    title.className = "group";
    const name = document.createElement("span"), count = document.createElement("span");
    name.textContent = label;
    count.textContent = indices.length;
    title.append(name, count);
    modelList.append(title);
    for (const i of indices) {
      const b = document.createElement("button");
      b.className = "model";
      b.textContent = shortName(data.stands[i]);
      b.setAttribute("role", "listitem");
      b.setAttribute("aria-pressed", String(i === selectedIndex && !allBox.checked));
      b.onclick = () => select(i);
      modelList.append(b);
    }
  }
  if (!groups.size) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No model matches.";
    modelList.append(empty);
  }
  // On a phone the list scrolls on its own: keep the chosen model in sight.
  const chosen = modelList.querySelector("[aria-pressed=true]");
  if (chosen) modelList.scrollTop = chosen.offsetTop - 40;
}

function select(i) {
  selectedIndex = i;
  allBox.checked = false;
  fillModels();
  fillPoses();
  frameView();
  refresh();
}
const isBlocks = () => !allBox.checked && selected().kind === "blocks";

function refresh() {
  if (!data) return;
  scene.remove(current);
  current = new THREE.Group();
  const pose = poseSelect.value;
  if (allBox.checked) {
    const stands = data.stands.filter(isStand);
    stands.forEach((stand, i) => {
      const g = buildStand(stand, pose);
      g.position.x = (i - (stands.length - 1) / 2) * 1.6;
      current.add(g);
    });
  } else {
    const built = buildStand(selected(), pose);
    current.add(built);
    current.userData.meshes = built.userData.meshes;
    current.userData.player = built.userData.player;
  }
  scene.add(current);
  frame = 0;
  updateInfo();
}

function updateInfo() {
  const stand = selected(), pose = poseSelect.value;
  const pieces = s => (s.poses[pose] || s.poses.idle).filter(p => p).length;
  const heads = data.stands.filter(isStand);
  const count = allBox.checked ? heads.reduce((n, s) => n + pieces(s), 0) : pieces(stand);
  const rows = [];
  if (allBox.checked) {
    document.getElementById("chipName").textContent = "All Stands";
    document.getElementById("chipGroup").textContent = `${heads.length} side by side`;
    rows.push(["Models", heads.length]);
  } else {
    document.getElementById("chipName").textContent = shortName(stand);
    document.getElementById("chipGroup").textContent = groupOf(stand);
  }
  rows.push(["Display entities", count.toLocaleString()]);
  let note = "";
  if (!allBox.checked && stand.kind === "blocks") {
    const b = stand.size;
    rows.push(["Size (blocks)", `${(b[3] - b[0]).toFixed(1)} × ${(b[4] - b[1]).toFixed(1)} × ${(b[5] - b[2]).toFixed(1)}`]);
    rows.push(["Animation", animSelect.value === "none" ? "—" : animSelect.value]);
    const real = vanilla("obsidian");
    rows.push(["Textures", real ? "Minecraft" : "Stand-in colours"]);
    if (!real && LOCAL) note = "Run <code>website/textures.ps1</code> to draw the blocks with your Minecraft's textures.";
  } else if (!allBox.checked) {
    rows.push(["Skins", painted(stand) ? "Painted (stand-skins)" : "Mojang"]);
  }
  const stats = document.getElementById("stats");
  stats.innerHTML = "";
  for (const [k, v] of rows) {
    const dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = k;
    dd.textContent = v;
    stats.append(dt, dd);
  }
  document.getElementById("note").innerHTML = note;
}

function fillPoses() {
  const poses = new Set();
  const shown = allBox.checked ? data.stands.filter(isStand) : [selected()];
  shown.forEach(s => Object.keys(s.poses).forEach(k => poses.add(k)));
  const keep = poseSelect.value;
  poseSelect.innerHTML = "";
  poses.forEach(p => poseSelect.add(new Option(p, p)));
  if (poses.has(keep)) poseSelect.value = keep;

  animSelect.innerHTML = "";
  animSelect.add(new Option("none", "none"));
  if (isBlocks() && selected().frames) Object.keys(selected().frames).forEach(a => animSelect.add(new Option(a, a)));
  if (isBlocks()) animSelect.value = "idle";
  // The Monster's one animation: what it does once the player sees it, from the pose shown.
  // The Monster's visits from the pose shown: every behaviour that plays in its blocks.
  let visit = false;
  if (!allBox.checked && selected().anims) {
    loadMonsterAnims(selected());
    const plays = monsterAnims && monsterAnims[poseSelect.value];
    if (plays) {
      visit = true;
      const keep = animSelect.dataset.monster;
      Object.keys(plays).forEach(id => animSelect.add(new Option(BEHAVIORS[id] || id, id)));
      if (keep && plays[keep]) animSelect.value = keep;
    }
  }
  const blocks = isBlocks();
  document.getElementById("animLabel").classList.toggle("off", !blocks && !visit);
  document.getElementById("beamLabel").classList.toggle("off", !blocks);
  document.getElementById("boxLabel").classList.toggle("off", !blocks);
  document.getElementById("playerLabel").classList.toggle("off", allBox.checked || !selected().scenes);
  document.getElementById("paintedLabel").classList.toggle("off", blocks || !manifest
      || (!allBox.checked && !isStand(selected())));
}

/** Frames the camera and the grid on what is shown: a Stand is two blocks tall, a storm a hundred. */
function frameView(x = 0, z = 1, y = 0.25) {
  let centre = new THREE.Vector3(0, 0.95, 0), distance = allBox.checked ? 9 : 4.2, extent = 12;
  if (!allBox.checked && selected().size) {
    // A concept model has a box per pose: the Monster and the player wherever the pose puts them.
    const scene = selected().scenes && selected().scenes[poseSelect.value];
    const b = scene ? scene.size : selected().size;
    centre = new THREE.Vector3((b[0] + b[3]) / 2, (b[1] + b[4]) / 2, (b[2] + b[5]) / 2);
    const radius = Math.max(b[3] - b[0], b[4] - b[1], b[5] - b[2]) / 2;
    distance = isBlocks() ? Math.max(9, radius * 3.4) : Math.max(4.2, radius * 4.4);
    extent = Math.max(16, Math.ceil(radius * 4 / 8) * 8);
  }
  controls.target.copy(centre);
  camera.position.set(centre.x + x * distance, centre.y + distance * y, centre.z + z * distance);
  controls.update();
  scene.remove(grid);
  grid = new THREE.GridHelper(extent, Math.min(64, extent), 0x3a404c, 0x262a33);
  scene.add(grid);
}

/** The first of these that answers: the site's copy, then the checkout's. */
function firstJson(...paths) {
  return paths.reduce((chain, path) => chain.catch(() =>
      fetch(new URL(path, location.href)).then(r => { if (!r.ok) throw new Error(path); return r.json().then(j => ({ j, path })); })),
    Promise.reject());
}
// Where the painted skins' png files live, set by whichever manifest answered.
let skinBase = "skins/";
const manifestLoad = window.STAND_VIEWER_MANIFEST ? Promise.resolve(window.STAND_VIEWER_MANIFEST)
    : firstJson("skins/manifest.json", "../../models/stand-skins/out/manifest.json")
        .then(({ j, path }) => { skinBase = path.replace("manifest.json", ""); return j; })
        .catch(() => { paintedBox.disabled = true; return null; });
const modelsLoad = window.STAND_VIEWER_DATA ? Promise.resolve(window.STAND_VIEWER_DATA)
    : firstJson("models.json", "../../../target/stand-viewer/models.json").then(({ j }) => j);
Promise.all([modelsLoad, manifestLoad])
    .then(([json, m]) => {
  data = json;
  manifest = m;
  // Skins with no Stand of their own (DIO himself) are shown on the same eleven heads.
  const base = data.stands.find(isStand);
  for (const key of Object.keys(manifest || {})) {
    if (base && !data.stands.some(s => s.key === key)) {
      const name = key.split("-").map(w => w[0].toUpperCase() + w.slice(1)).join(" ");
      data.stands.push({ key, name, kind: "heads", poses: base.poses });
    }
  }
  const wanted = new URLSearchParams(location.search);
  if (wanted.has("stand")) {
    const i = data.stands.findIndex(s => s.key === wanted.get("stand"));
    if (i >= 0) selectedIndex = i;
  }
  if (wanted.has("all")) allBox.checked = true;
  if (wanted.has("still")) spinBox.checked = false;
  if (wanted.has("painted")) paintedBox.checked = true;
  if (wanted.has("boxes")) hitBox.checked = true;
  fillModels();
  fillPoses();
  if (wanted.has("pose")) poseSelect.value = wanted.get("pose");
  if (wanted.has("anim")) animSelect.value = animSelect.dataset.monster = wanted.get("anim");
  frameView();
  refresh();
}).catch(e => {
  const status = document.getElementById("status");
  status.classList.remove("off");
  status.innerHTML = "<div>The models did not load. From a checkout, run <code>mvn test</code> once and reload; on the site, try again in a moment.<br><br><small></small></div>";
  status.querySelector("small").textContent = String(e);
  document.getElementById("chipName").textContent = "No models";
});

search.oninput = () => { if (data) fillModels(); };
poseSelect.onchange = () => {
  // Each pose of the Monster plays its own behaviours: the menu is rebuilt, keeping the one chosen.
  if (selected().anims) fillPoses(); else animSelect.value = "none";
  if (selected().scenes) frameView();
  refresh();
};
animSelect.onchange = () => { animSelect.dataset.monster = animSelect.value; frame = 0; refresh(); };
paintedBox.onchange = refresh;
playerBox.onchange = refresh;
beamBox.onchange = refresh;
hitBox.onchange = refresh;
allBox.onchange = () => { fillModels(); fillPoses(); frameView(); refresh(); };
const view = (x, z, y) => () => { spinBox.checked = false; current.rotation.y = 0; frameView(x, z, y); };
document.getElementById("front").onclick = view(0, 1);
document.getElementById("side").onclick = view(1, 0);
document.getElementById("back").onclick = view(0, -1);
document.getElementById("top").onclick = view(0, 0.02, 1.1);

// The exported frames are three ticks apart, so they are played at 20 ticks a second.
const FRAME_MS = 150;
let last = performance.now();
// The Monster's visit runs at the game's own 20 ticks a second, with a second of nothing after it vanishes.
const TICK_MS = 50, AFTER_TICKS = 20;
renderer.setAnimationLoop(now => {
  if (spinBox.checked) current.rotation.y += 0.004;
  const plays = data && !allBox.checked && selected().anims && monsterAnims && monsterAnims[poseSelect.value];
  const visit = plays && plays[animSelect.value];
  if (visit && current.userData.meshes) {
    clock += now - last;
    while (clock >= TICK_MS) {
      clock -= TICK_MS;
      frame = (frame + 1) % (visit.length + AFTER_TICKS);
      poseFrame(selected(), visit[Math.min(frame, visit.length - 1)], current.userData.meshes, current.userData.player);
    }
  } else {
    document.getElementById("dark").style.opacity = 0;
  }
  if (data && isBlocks() && animSelect.value !== "none" && current.userData.meshes) {
    clock += now - last;
    const frames = selected().frames[animSelect.value];
    while (clock >= FRAME_MS) {
      clock -= FRAME_MS;
      frame = (frame + 1) % frames.length;
      frames[frame].forEach((p, i) => { const mesh = current.userData.meshes[i]; if (p && mesh) place(mesh, p); });
    }
  }
  last = now;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
